<h2>Login</h2>

<form id="loginForm">

  <input
    type="email"
    id="email"
    placeholder="Email"
    required
  />

  <input
    type="password"
    id="password"
    placeholder="Password"
    required
  />

  <button type="submit">
    Login
  </button>

</form>

<script>

document
  .getElementById("loginForm")
  .addEventListener("submit", async (e) => {

    e.preventDefault();

    const res = await fetch(
      "http://localhost:3000/api/auth/login",
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          email: document.getElementById("email").value,
          password: document.getElementById("password").value
        })
      }
    );

    const data = await res.json();

    if (data.token) {

      // Save token
      localStorage.setItem(
        "token",
        data.token
      );

      // Save role
      localStorage.setItem(
        "role",
        data.role
      );

      alert("Login successful");

      console.log(data);

    } else {

      alert(data.message);

    }

});

</script>
